<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href ="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Contact us|page</title>
</head>
<body>
   
    <main id="contact-us" data-testid="test-contact-us">
        <p id="thank-you-message" data-testid="test-contact-success">
            Submission successful!
         </p>
         <p id="incomplete-details-message" data-testid="test-contact-success">
           Submission failed!!
        </p>
        <form autocomplete="off" class="form">
            <h2 class="title">Register</h2>
            <p class="sign">Sign up now and get full access to my bio.</p>
            <section class="form-group">
                <div class="input-control">
                <label for="name" data-testid="test-contact-name">
                    <input type="text" id="username" placeholder="Enter your full name here..." required>
                </label>
                <div class="error"></div>
            </div>
                <div class="input-control">
                <label for="email" data-testid="test-contact-email">
                    <input type="email" id="email" placeholder="name@example.com..." required>
                </label>
                <div class="error"></div>
            </div>
                <div class="input-control">
                <label for="subject" data-testid="test-contact-subject">
                    <input type="text" id="subject" placeholder="subject:" required>
                </label>
                <div class="error"></div>
            </div>
                <div class="input-control">
                <label for="message" data-testid="test-contact-message">
                    <input type="message" id="message" placeholder="Write your message..."  minlength="10" required>
                </label>
                <div class="error"></div>
            </div>
            </section>
            <button class="submit" data-testid="test-contact-submit">Submit</button>
            <p class="account">
                Already have an account ?
                <a href="index.html">SignIn</a>
            </p>
        </form>
    </main>
    <script src="./Js/valid.js"></script>
</body>
</html>
